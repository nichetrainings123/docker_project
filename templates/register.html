{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
  <header class="form-heading">
    <p class="eyebrow">GET STARTED</p>
    <h1>Create your account</h1>
    <p class="subtitle">A few details and you’re ready to go.</p>
  </header>
  <form method="post" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Name</label>
    <input id="username" name="username" type="text" autocomplete="name" maxlength="80" placeholder="Your name" required>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
    <button type="submit">Create account <span aria-hidden="true">→</span></button>
  </form>
  <p class="switch-form">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
{% endblock %}
