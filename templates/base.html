<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Welcome{% endblock %} | Northstar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="page-shell">
      <section class="auth-card">
        <a class="brand" href="{{ url_for('index') }}" aria-label="Northstar home">
          <span class="brand-mark">N</span>
          <span>northstar</span>
        </a>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="messages" role="status">
              {% for category, message in messages %}
                <p class="message message-{{ category }}">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
        <p class="fine-print">Secure access to your workspace</p>
      </section>
    </main>
  </body>
</html>
